{% extends "templates/web.html" %}

{%- block title -%}{{_("Not Found")}}{%- endblock -%}

{% block page_content %}

<script>
	window.is_404 = true;
</script>
<!-- //// add lotie animation -->
<script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
<dotlottie-player src="/assets/frappe/lottie/animation-404.json" background="transparent" speed="1" style="max-width: 500px;margin: -15px auto 0 auto;" loop autoplay></dotlottie-player>
<!-- //// end -->

<div class="error-page">
	<!--<img class="img-404" src="/assets/frappe/images/ui-states/404.png" />-->
	<div>
		<h2 class="mb-1 mt-4">
			{{ _("There's nothing here") }}
		</h2>
		<div class="text-muted error-text">
			{{ _("The page you are looking for has gone missing.") }}
		</div>
		<div class="mt-6 back-to-home"><a href='/' class='btn btn-primary'>{{ _("Back to Home") }}</a></div>
	</div>
</div>

{% endblock %}
