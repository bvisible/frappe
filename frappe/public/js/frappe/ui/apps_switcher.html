<!-- //// Neoffice - added file, no upstream equivalent (9999364ec6, 2025-10-28 "Refonte de l'interface
     //// utilisateur avec nouvelle sidebar et apps switcher"): the template frappe.ui.AppsSwitcher.make()
     //// renders at the top of the desk sidebar (ui/apps_switcher.js) - app logo, app title, and since
     //// e995a72fc6 (2026-04-24 "feat(sidebar): hide modules-section when collapsed + add 'Active
     //// Module' subtitle") the two-line header .app-title-name / .app-title-subtitle, which
     //// set_current_app updates separately so the subtitle survives. Styles in scss/desk/sidebar.scss.
     //// v16 merge note: upstream develop has no ui/apps_switcher.* - its switcher is the sidebar
     //// header menu (ui/sidebar/sidebar_header.js and .html), a different design: re-implement rather
     //// than merge. -->
<a class="app-switcher-dropdown" style="text-decoration: none;">
    <div class="standard-sidebar-item">
        <div class="d-flex">
            <div class="sidebar-item-icon app-logo-container">
                <img class="app-logo"
                    src="{%= app_logo_url %}" alt="{%= ("App Logo") %}">
            </div>
            <div class="sidebar-item-label app-title" style="margin-left: 10px;">
                <div class="app-title-name">{%= app_title %}</div>
                <div class="app-title-subtitle">{%= subtitle %}</div>
            </div>
        </div>
        <div class="sidebar-item-control">
            <button class="btn-reset drop-icon show-in-edit-mode">
                <svg class="es-icon es-line  icon-sm" style="display: block;margin:auto;" aria-hidden="true">
                    <use class="" href="#es-line-down"></use>
                </svg>
            </button>
        </div>
    </div>
</a>

<div class="app-switcher-menu hidden" role="menu">
</div>
