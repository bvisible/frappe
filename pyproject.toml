[project]
name = "frappe"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "developers@frappe.io"}
]
description = "Metadata driven, full-stack low code web framework"
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # //// Neoffice — the pins marked maintenance#1679 are ranges every app of the bench can share: pip could
    # not satisfy upstream's pins together with suite, payments (wallee), nora (mcp), builder (pdfplumber)
    # and frappe-bench, so each update downgraded these packages for frappe and the next app upgraded them
    # again. At an upstream merge, take upstream's pin only if `pip check` stays empty on the whole bench.
    # core dependencies
    "Babel~=2.18.0",
    "Click~=8.4.1",
    "filelock~=3.20.1",
    "filetype~=1.2.0",
    "GitPython~=3.1.34",
    "Jinja2~=3.1.2",
    "Pillow~=12.3.0",
    "PyJWT~=2.15.0",
    "duckdb~=1.4.3",
    "pyarrow~=25.0.0",
    # We depend on internal attributes,
    # do NOT add loose requirements on PyMySQL versions.
    "PyMySQL==1.1.1",
    "pypdf==6.19.0",
    "PyPika @ git+https://github.com/frappe/pypika@7ef6e40215d46cd531e8c4e58650b84c11abbd04",
    "PyQRCode~=1.2.1",
    "PyYAML~=6.0.2",
    "RestrictedPython~=8.5",
    "WeasyPrint==70.0",
    "pydyf==0.12.1",
    "Werkzeug==3.1.9",
    "Whoosh~=2.7.4",
    "beautifulsoup4>=4.12.2,<5",  # //// Neoffice — was ~=4.12.2; suite needs >=4.13.5 (maintenance#1679)
    "bleach-allowlist~=1.0.3",
    "bleach~=6.4.0",
    "tinycss2==1.5.1",
    "cairocffi==1.5.1",
    "chardet~=5.2.0",
    "croniter~=6.0.0",
    "cryptography~=50.0.0",
    "cssutils~=2.11.1",
    "email-reply-parser~=0.5.12",
    "gunicorn @ git+https://github.com/frappe/gunicorn@bb554053bb87218120d76ab6676af7015680e8b6",
    "html5lib~=1.1",
    "ipython~=8.15.0",
    "ldap3~=2.9",
    "markdown2~=2.5.3",
    "MarkupSafe~=3.0.2",
    "maxminddb-geolite2==2018.703",
    "num2words~=0.5.14",
    "oauthlib~=4.0.0",
    "openpyxl~=3.1.5",
    "passlib~=1.7.4",
    "pdfkit~=1.0.0",
    "phonenumbers~=9.0.23",
    "premailer~=3.10.0",
    "psutil~=5.9.5",
    "psycopg2-binary~=2.9.1",
    "pyOpenSSL~=26.4.0",
    "pydantic>=2.12.0,<3.0.0",  # //// Neoffice — upstream: ~=2.12.0 (2.12.* only); the benches already run 2.13 for our other apps (nora's mcp), a pin would downgrade it (maintenance#1679)
    "pyotp~=2.9.0",
    "python-dateutil~=2.9.0",
    "pytz==2025.2",
    "rauth~=0.7.3",
    "redis~=4.5.5",
    "hiredis~=2.2.3",
    "requests-oauthlib~=1.3.1",
    "requests>=2.32.0,<3",  # //// Neoffice — upstream: ~=2.33.0; the frappe-bench of a bench pins requests too (5.29: ~=2.32.5, 5.31: ~=2.33.0), so the range covers both (maintenance#1679)
    "rq==1.15.1",
    "rsa>=4.1",
    "semantic-version~=2.10.0",
    "sentry-sdk~=1.45.1",
    "sqlparse~=0.6.0",
    "sql_metadata~=3.0.1",
    "tenacity~=8.2.2",
    "terminaltables~=3.1.10",
    "traceback-with-variables~=2.0.4",
    "typing_extensions>=4.6.1,<5",
    "tomli~=2.0.1",
    "xlrd~=2.0.1",
    "zxcvbn~=4.4.28",
    "markdownify~=0.14.1",

    # integration dependencies
    "boto3>=1.34.143,<2",  # //// Neoffice — was ~=1.34.143 (upstream still is); suite needs ~=1.43.29 (maintenance#1679)
    "dropbox~=12.0.2",
    "google-api-python-client~=2.188.0",
    "google-auth-oauthlib~=1.2.4",
    "google-auth~=2.48.0",
    "posthog~=3.21.0",
    "vobject~=0.9.7",

    # //// Neoffice — added dependency, absent from upstream version-15 (c64ffb849d 2025-09-25 "feat: Chrome PDF
    # //// generator", cherry-picked from frappe develop 964dd6c034): utils/pdf_generator/cdp_connection.py
    # //// drives headless Chrome over its DevTools websocket.
    # PDF generation (Chrome PDF generator backport from v16)
    "websockets~=15.0.1",
]

[project.urls]
Homepage = "https://frappe.io/framework"
Repository = "https://github.com/frappe/frappe.git"
Documentation = "https://docs.frappe.io/framework"
"Bug Reports" = "https://github.com/frappe/frappe/issues"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
coverage = "~=6.5.0"
Faker = "~=18.10.1"
pyngrok = "~=7.5.0"
unittest-xml-reporting = "~=3.2.0"
watchdog = "~=3.0.0"
hypothesis = "~=6.77.0"
responses = "==0.23.1"
freezegun = "~=1.2.2"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.frappix]
# use identifier from https://search.nixos.org/packages
nixpkgs-deps = [
    "mariadb",
    "restic",
    "wkhtmltopdf-bin",
    "which",
    "gzip",
    "bash",
    "redis",
    "nodejs_20",
    "python312",
]
